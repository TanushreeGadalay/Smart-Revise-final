<!DOCTYPE html>
<html>
<head>
    <title>SmartRevise - Login / Sign Up</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- Radio Buttons -->
    <input type="radio" name="tab" id="login" checked>
    <input type="radio" name="tab" id="signup">

    <!-- Toggle Tabs -->
    <div class="tabs">
        <label for="login">Login</label>
        <label for="signup">Sign Up</label>
    </div>

    <div class="form-container">

        <!-- LOGIN FORM -->
        <div class="form login-form">
            <h2>Login</h2>

            <form onsubmit="loginUser(event)">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>

                <button type="submit">Sign In</button>
            </form>

            <p>
                Don't have an account?
                <label for="signup" class="link">Sign Up</label>
            </p>
        </div>

        <!-- SIGNUP FORM -->
        <div class="form signup-form">
            <h2>Create Account</h2>

            <form onsubmit="signupUser(event)">
                <input type="text" id="signup-name" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>

                <button type="submit">Create Account</button>
            </form>

            <p>
                Already have an account?
                <label for="login" class="link">Login</label>
            </p>
        </div>

    </div>

</div>

<script>

console.log("Auth page loaded");

// ---------------- SIGNUP ----------------
async function signupUser(event) {

    event.preventDefault(); // stop page refresh

    const name = document.getElementById("signup-name").value.trim();
    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value.trim();

    try {
        const response = await fetch("http://127.0.0.1:5000/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if(response.ok){
            alert("Signup successful! Please login.");
            document.getElementById("login").checked = true;
        } else {
            alert(data.error || "Signup failed");
        }

    } catch(error) {
        console.error("Signup Error:", error);
        alert("Cannot connect to server. Make sure Flask is running.");
    }
}


// ---------------- LOGIN ----------------
async function loginUser(event) {

    event.preventDefault(); // stop page refresh

    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value.trim();

    try {
        const response = await fetch("http://127.0.0.1:5000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if(response.ok){

            localStorage.setItem("user", JSON.stringify(data.user));

            alert("Login successful!");

            window.location.href = "dashboard.html";

        } else {
            alert(data.error || "Login failed");
        }

    } catch(error) {
        console.error("Login Error:", error);
        alert("Cannot connect to server. Make sure Flask is running.");
    }
}

</script>

</body>
</html>
