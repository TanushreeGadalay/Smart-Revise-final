<!DOCTYPE html>
<html>

<head>
    <title>SmartRevise - Logic Building</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="progress-tracker.js"></script>
    <style>
        .logic-container {
            padding: 40px;
        }

        .logic-header {
            margin-bottom: 30px;
        }

        .logic-header h1 {
            color: #6366f1;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .difficulty-filter {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .difficulty-btn {
            padding: 8px 16px;
            border: 2px solid #e0e7ff;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .difficulty-btn:hover {
            background: #f0f4ff;
        }

        .difficulty-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .problems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .problem-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            border-left: 4px solid #6366f1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .problem-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .problem-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .problem-desc {
            color: #6b7280;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .problem-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .difficulty.easy {
            background: #dcfce7;
            color: #166534;
        }

        .difficulty.medium {
            background: #fef3c7;
            color: #92400e;
        }

        .difficulty.hard {
            background: #fee2e2;
            color: #991b1b;
        }

        .solve-btn {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .solve-btn:hover {
            background: #4f46e5;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #6b7280;
        }

        .close-modal:hover {
            color: #1f2937;
        }

        .problem-solution {
            margin-top: 20px;
        }

        .solution-code {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin-top: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-solved {
            background: #10b981;
            color: white;
        }

        .btn-solved:hover {
            background: #059669;
        }

        .btn-attempted {
            background: #f59e0b;
            color: white;
        }

        .btn-attempted:hover {
            background: #d97706;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #1f2937;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>
    <div class="outer-bg">
        <div class="container">
            <nav class="navbar">
                <div class="logo">🔷 SmartRevise AI</div>
                <div class="nav-links"><a href="dashboard.html">Dashboard</a><button class="logout-btn"
                        onclick="logout()">Logout</button></div>
            </nav>

            <div class="logic-container">
                <div class="logic-header">
                    <h1>🧠 Logic Building</h1>
                    <p>Master problem-solving with curated logic building challenges</p>
                    <div class="difficulty-filter">
                        <button class="difficulty-btn active" onclick="filterByDifficulty('all')">All</button>
                        <button class="difficulty-btn" onclick="filterByDifficulty('easy')">Easy</button>
                        <button class="difficulty-btn" onclick="filterByDifficulty('medium')">Medium</button>
                        <button class="difficulty-btn" onclick="filterByDifficulty('hard')">Hard</button>
                    </div>
                </div>

                <div class="problems-grid" id="problems-grid">
                    <!-- Problems will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Problem Modal -->
    <div id="problem-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                <!-- Problem details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const problems = [
            {
                id: 1,
                title: "Two Sum Problem",
                description: "Given an array of integers, find two numbers that add up to a specific target.",
                difficulty: "easy",
                language: "Python",
                solution: "def twoSum(arr, target):\n    seen = set()\n    for num in arr:\n        if target - num in seen:\n            return [target - num, num]\n        seen.add(num)\n    return None"
            },
            {
                id: 2,
                title: "Palindrome Check",
                description: "Check if a given string is a palindrome (reads the same forwards and backwards).",
                difficulty: "easy",
                language: "Python",
                solution: "def isPalindrome(s):\n    s = s.lower().replace(' ', '')\n    return s == s[::-1]"
            },
            {
                id: 3,
                title: "Array Reversal",
                description: "Reverse an array in-place without using extra space.",
                difficulty: "easy",
                language: "Python",
                solution: "def reverseArray(arr):\n    left, right = 0, len(arr) - 1\n    while left < right:\n        arr[left], arr[right] = arr[right], arr[left]\n        left += 1\n        right -= 1\n    return arr"
            },
            {
                id: 4,
                title: "Fibonacci Series",
                description: "Generate the Fibonacci series up to n terms efficiently.",
                difficulty: "medium",
                language: "Python",
                solution: "def fibonacci(n):\n    if n <= 1:\n        return [0] if n == 1 else []\n    a, b = 0, 1\n    fib = [a, b]\n    for _ in range(n - 2):\n        a, b = b, a + b\n        fib.append(b)\n    return fib"
            },
            {
                id: 5,
                title: "Anagram Check",
                description: "Determine if two strings are anagrams of each other.",
                difficulty: "medium",
                language: "Python",
                solution: "def isAnagram(s1, s2):\n    return sorted(s1.lower()) == sorted(s2.lower())"
            },
            {
                id: 6,
                title: "Binary Search",
                description: "Implement binary search on a sorted array to find a target value.",
                difficulty: "medium",
                language: "Python",
                solution: "def binarySearch(arr, target):\n    left, right = 0, len(arr) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1"
            },
            {
                id: 7,
                title: "LCS Problem",
                description: "Find the longest common subsequence between two strings.",
                difficulty: "hard",
                language: "Python",
                solution: "def lcs(s1, s2):\n    m, n = len(s1), len(s2)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if s1[i-1] == s2[j-1]:\n                dp[i][j] = dp[i-1][j-1] + 1\n            else:\n                dp[i][j] = max(dp[i-1][j], dp[i][j-1])\n    return dp[m][n]"
            },
            {
                id: 8,
                title: "Merge Sorted Arrays",
                description: "Merge two sorted arrays into one sorted array.",
                difficulty: "hard",
                language: "Python",
                solution: "def mergeSorted(arr1, arr2):\n    result = []\n    i, j = 0, 0\n    while i < len(arr1) and j < len(arr2):\n        if arr1[i] <= arr2[j]:\n            result.append(arr1[i])\n            i += 1\n        else:\n            result.append(arr2[j])\n            j += 1\n    result.extend(arr1[i:])\n    result.extend(arr2[j:])\n    return result"
            }
        ];

        let currentFilter = "all";
        let currentProblem = null;

        function filterByDifficulty(difficulty) {
            currentFilter = difficulty;
            updateButtons();
            loadProblems();
        }

        function updateButtons() {
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function loadProblems() {
            const filtered = currentFilter === 'all' 
                ? problems 
                : problems.filter(p => p.difficulty === currentFilter);

            const grid = document.getElementById('problems-grid');
            grid.innerHTML = filtered.map(problem => `
                <div class="problem-card">
                    <div class="problem-title">${problem.title}</div>
                    <div class="problem-desc">${problem.description}</div>
                    <div class="problem-meta">
                        <span class="difficulty ${problem.difficulty}">${problem.difficulty.toUpperCase()}</span>
                        <span>${problem.language}</span>
                    </div>
                    <button class="solve-btn" onclick="openProblem(${problem.id})">View & Solve</button>
                </div>
            `).join('');
        }

        function openProblem(id) {
            currentProblem = problems.find(p => p.id === id);
            const modal = document.getElementById('problem-modal');
            const modalBody = document.getElementById('modal-body');

            modalBody.innerHTML = `
                <h2>${currentProblem.title}</h2>
                <p>${currentProblem.description}</p>
                <div class="problem-meta">
                    <span class="difficulty ${currentProblem.difficulty}">${currentProblem.difficulty.toUpperCase()}</span>
                    <span>${currentProblem.language}</span>
                </div>
                <div class="problem-solution">
                    <h3>Sample Solution:</h3>
                    <div class="solution-code">${currentProblem.solution}</div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-solved" onclick="markSolved()">✓ Mark as Solved</button>
                    <button class="btn btn-attempted" onclick="markAttempted()">⚡ Mark as Attempted</button>
                    <button class="btn btn-cancel" onclick="closeModal()">Close</button>
                </div>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('problem-modal').style.display = 'none';
            currentProblem = null;
        }

        async function markSolved() {
            const success = await trackLogicBuildingCompletion(
                currentProblem.title,
                currentProblem.language,
                "solved"
            );
            if (success) {
                alert("✓ Great! Problem marked as solved and progress tracked!");
                closeModal();
            }
        }

        async function markAttempted() {
            const success = await trackLogicBuildingCompletion(
                currentProblem.title,
                currentProblem.language,
                "attempted"
            );
            if (success) {
                alert("⚡ Progress tracked! Keep practicing to solve this problem.");
                closeModal();
            }
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "auth.html";
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('problem-modal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Load problems on page load
        window.onload = loadProblems;
    </script>
</body>

</html>
